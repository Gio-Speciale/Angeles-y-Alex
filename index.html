    <style>

        body {
            opacity: 0;
            transition: opacity 0.5s ease;
            font-family: 'Book Antiqua', 'Georgia', serif;
            color: #705E5E;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        #invitacion {
            background: url('fondo-estatico.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .reloj-container {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin: 15px 0;
        }

        .flip-box {
            border: 1px solid #705E5E;
            color: #705E5E;
            padding: 4px 10px; /* ← AUMENTA EL PADDING HORIZONTAL */
            border-radius: 2px;
            text-align: center;
            width: auto; /* ← PARA QUE SE AJUSTE AL PADDING */
            min-width: 30px; /* ← ANCHO MÍNIMO PARA QUE SEAN MÁS ANCHOS */
        }

        .flip-box span {
            display: block;
            font-size: 16px;
            font-weight: bold;
        }

        .flip-box label {
            font-size: 10px;
            text-transform: uppercase;
        }

        @keyframes pulso {
            0% { transform: scale(1); }
            50% { transform: scale(1.015); }
            100% { transform: scale(1); }
        }

        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .boton-ubicacion {
            animation: latido 2s infinite ease-in-out;
        }


        /* =========================================
           EFECTO DEL SOBRE
           ========================================= */

        #contenedor-sobre {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
            perspective: 1200px;
            perspective-origin: center center;
            margin: 0;
            padding: 0;

            background-color: transparent;

            overflow: hidden;
            z-index: 2000;
            transition: opacity 1s ease;
        }


        /* BASE DEL SOBRE */

        #sobre-base {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: url('sobre-abierto-1.png') no-repeat center center;
            background-size: cover;

            z-index: 1;
            pointer-events: none;
        }


        /* SOLAPA DEL SOBRE */

        #solapa-superior {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: url('sobre-abierto-2.png') no-repeat center top;
            background-size: cover;

            transform-origin: top center;
            transform-style: preserve-3d;

            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;

           transition: transform 5s linear;

            z-index: 10;
            pointer-events: none;
        }


        /* APERTURA HACIA AFUERA */

        #contenedor-sobre.abierto #solapa-superior {
            transform: rotateX(180deg);
        }

        /* =========================================
   DESLIZAMIENTO DE SOBRE-ABIERTO-1
   ========================================= */

#contenedor-sobre.desvanecer-base #sobre-base {
    animation: deslizar-sobre-abierto 3s linear forwards;
}

@keyframes deslizar-sobre-abierto {

    0% {
        transform: translateY(0);
        opacity: 1;
    }

    100% {
        transform: translateY(100vh);
        opacity: 0;
    }

}

        /* PULSO MIENTRAS EL SOBRE ESTÁ CERRADO */

        #contenedor-sobre:not(.abierto) {
            animation: pulso 5s infinite ease-in-out;
        }


        .seccion {
            width: 100%;
            margin: 0;
            padding: 0;
        }


        img {
            width: 100%;
            height: auto;
            display: block;
        }


        #btnAudio {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 45px;
            height: 45px;
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
        }


        /* APARICIÓN DE TOCA PARA ABRIR */

        .retraso-aparicion {
            opacity: 0;
            animation: aparecer 0.5s ease-in forwards;
            animation-delay: 2s;
        }

        .retraso-aparicion span {
            font-weight: bold;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* CARRUSEL 16:9 */

        .swiper-slide {
            width: 70%;
            aspect-ratio: 16 / 9;
            transition: all 0.5s;
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide-img,
        .slide-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-video {
            display: none;
        }


        /* INDICADOR VER MÁS */

        .indicador-json-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0px;
            background: transparent;
            padding: 0;
            border: none;
            z-index: 99;
            pointer-events: none;
            transition: opacity 1s ease;
        }

      .indicador-json-container span {
    color: white;
    font-size: 17px;
    font-family: sans-serif;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: -5px;
    filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.9));
}

        .indicador-json-container lottie-player {
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.8));
        }

        /* =========================================
           INDICADOR DE VIDEO EN ESQUINA
           ========================================= */
        .video-indicator {
            position: absolute;
            bottom: 10px;
            right: 15px;
            color: white;
            font-size: 12px; /* ← AUMENTADO 1 PUNTO (de 11px a 12px) */
            font-family: sans-serif;
            font-weight: bold; /* ← NEGRILLA */
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            opacity: 0.8;
            transition: opacity 0.5s ease;
            z-index: 6;
            pointer-events: none;
        }

        /* Ocultar cuando el video se está reproduciendo */
        .swiper-slide.reproduciendo .video-indicator {
            opacity: 0;
        }

        /* Mostrar cuando el video está pausado o no se ha reproducido */
        .swiper-slide:not(.reproduciendo) .video-indicator {
            opacity: 0.8;
        }
        /* CARRUSEL DE FOTOS */

        .slideshow-contenedor {
            position: relative;
            width: 100%;
            height: auto;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

         /* =========================================
           CARRUSEL DE FOTOS - CONTROLADO POR JS
           ========================================= */

        .slideshow-contenedor {
            position: relative;
            width: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .slide-foto {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            display: block;
            opacity: 0;
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
        }

        .slide-foto:first-child {
            position: relative;
        }
        
        /* =====================================================
           FORMATO VERTICAL TIPO CELULAR
           PC, LAPTOP Y PANTALLAS GRANDES
           ===================================================== */

        @media (min-width: 768px) {

            html,
            body {
                background-color: #e8d8d4;
            }


            /*
             * LA INVITACIÓN SE COMPORTA COMO UN
             * CELULAR GRANDE Y VERTICAL.
             */

            #invitacion {

                width: 620px;
                max-width: 620px;

                margin-left: auto;
                margin-right: auto;

                min-height: 100vh;

                box-shadow:
                    0 0 35px rgba(0, 0, 0, 0.18);

                overflow-x: hidden;
            }


            /*
             * TODAS LAS IMÁGENES CONSERVAN
             * SU PROPORCIÓN ORIGINAL.
             */

            #invitacion .seccion {
                width: 100%;
            }

            #invitacion img {
                width: 100%;
                height: auto;
                max-width: none;
            }


            /*
             * CARRUSEL DE FOTOS
             */

            #invitacion .slideshow-contenedor {
                width: 100%;
            }

            #invitacion .slide-foto {
                width: 100%;
                height: auto;
            }


            /*
             * CARRUSEL SWIPER
             */

            #invitacion .mySwiper {
                width: 100% !important;
            }


            /*
             * SOBRE:
             * EXACTAMENTE EL MISMO ANCHO QUE
             * LA INVITACIÓN.
             */

            #contenedor-sobre {

                width: 620px;
                max-width: 620px;

                left: 50%;

                margin-left: -310px;

                transform: none;

                height: 100vh;
            }


            /*
             * EVITA QUE LA ANIMACIÓN DE PULSO
             * DESPLACE EL SOBRE.
             */

            #contenedor-sobre:not(.abierto) {

                animation: pulso-sobre-pc 5s infinite ease-in-out;

            }


            @keyframes pulso-sobre-pc {

                0% {
                    transform: translateX(0) scale(1);
                }

                50% {
                    transform: translateX(0) scale(1.015);
                }

                100% {
                    transform: translateX(0) scale(1);
                }

            }


            /*
             * BASE Y SOLAPA DEL SOBRE
             */

            #sobre-base,
            #solapa-superior {

                width: 100%;
                height: 100%;
            }


            /*
             * BOTÓN DE AUDIO
             */

            #btnAudio {

                left: calc(50% - 310px - 10px);

            }

        }


        /* =====================================================
           TODAS LAS PANTALLAS EN HORIZONTAL
           CELULAR GIRADO / TABLET / LAPTOP / PC
           ===================================================== */

        @media (orientation: landscape) {

            /*
             * EN PANTALLAS HORIZONTALES LA INVITACIÓN
             * SIGUE SIENDO VERTICAL, COMO UN CELULAR.
             */

            #invitacion {

                width: min(620px, 100vw);

                max-width: 620px;

                margin-left: auto;
                margin-right: auto;

                min-height: 100vh;

                box-shadow:
                    0 0 35px rgba(0, 0, 0, 0.18);

                overflow-x: hidden;
            }


            /*
             * TODAS LAS SECCIONES CONSERVAN
             * EL ANCHO DEL FORMATO VERTICAL.
             */

            #invitacion .seccion {
                width: 100%;
            }


            #invitacion img {

                width: 100%;
                height: auto;
                max-width: none;

            }


            /*
             * CARRUSEL DE FOTOS
             */

            #invitacion .slideshow-contenedor {
                width: 100%;
            }

            #invitacion .slide-foto {

                width: 100%;
                height: auto;

            }


            /*
             * CARRUSEL DE VIDEOS
             */

            #invitacion .mySwiper {

                width: 100% !important;

            }


            /*
             * SOBRE EN PANTALLA HORIZONTAL.
             *
             * SE CENTRA EXACTAMENTE CON LA INVITACIÓN.
             */

            #contenedor-sobre {

                width: min(620px, 100vw);

                max-width: 620px;

                left: 50%;

                margin-left: 0;

                transform: translateX(-50%);

                height: 100vh;

            }


            /*
             * EL SOBRE Y LA INVITACIÓN
             * TIENEN EL MISMO ANCHO.
             */

            #sobre-base,
            #solapa-superior {

                width: 100%;
                height: 100%;

            }


            /*
             * PULSO DEL SOBRE SIN DESPLAZAMIENTO.
             */

            #contenedor-sobre:not(.abierto) {

                animation: pulso-sobre-horizontal 5s infinite ease-in-out;

            }


            @keyframes pulso-sobre-horizontal {

                0% {
                    transform: translateX(-50%) scale(1);
                }

                50% {
                    transform: translateX(-50%) scale(1.015);
                }

                100% {
                    transform: translateX(-50%) scale(1);
                }

            }

        }


        /* =====================================================
           CELULAR EN HORIZONTAL
           ===================================================== */

        @media (max-width: 767px) and (orientation: landscape) {

            /*
             * EN UN CELULAR GIRADO:
             * UTILIZA HASTA 620 PX.
             * SI NO HAY ESPACIO, SE ADAPTA AL ANCHO
             * DISPONIBLE.
             */

            #invitacion {

                width: min(620px, 100vw);

                max-width: 620px;

                margin-left: auto;
                margin-right: auto;

                min-height: 100vh;

                box-shadow: none;

                overflow-x: hidden;

            }


            /*
             * EL SOBRE UTILIZA EXACTAMENTE
             * EL MISMO ANCHO.
             */

            #contenedor-sobre {

                width: min(620px, 100vw);

                max-width: 620px;

                left: 50%;

                margin-left: 0;

                transform: translateX(-50%);

                height: 100vh;

            }


            /*
             * PULSO CENTRADO.
             */

            #contenedor-sobre:not(.abierto) {

                animation: pulso-sobre-celular-horizontal 5s infinite ease-in-out;

            }


            @keyframes pulso-sobre-celular-horizontal {

                0% {
                    transform: translateX(-50%) scale(1);
                }

                50% {
                    transform: translateX(-50%) scale(1.015);
                }

                100% {
                    transform: translateX(-50%) scale(1);
                }

            }


            /*
             * BOTÓN DE AUDIO.
             */

            #btnAudio {

                left: 10px;

            }

        }


        /* =====================================================
           MONITORES MUY GRANDES
           ===================================================== */

        @media (min-width: 1400px) {

            #invitacion {

                width: 620px;
                max-width: 620px;

                margin-left: auto;
                margin-right: auto;

            }


            #contenedor-sobre {

                width: 620px;
                max-width: 620px;

                left: 50%;

                margin-left: -310px;

                transform: none;

            }


            #contenedor-sobre:not(.abierto) {

                animation: pulso-sobre-pc 5s infinite ease-in-out;

            }

        }

        /* =========================================
   EFECTO DE PÉTALOS
   ========================================= */

.petalo-animado {
    position: fixed;
    width: 28px;
    height: auto;

    pointer-events: none;

    z-index: 1500;

    opacity: 1;

    animation: caer-petalo 5s ease-out forwards;

    filter: drop-shadow(
        0 3px 5px rgba(0, 0, 0, 0.12)
    );
}


@keyframes caer-petalo {

    0% {
        opacity: 1;

        transform:
            translate(0, 0)
            rotate(0deg)
            scale(0.75);
    }

    15% {
        opacity: 1;
    }

    30% {
        opacity: 0.95;

        transform:
            translate(
                calc(var(--movimiento-x) * 0.25),
                calc(var(--movimiento-y) * 0.25)
            )
            rotate(calc(var(--rotacion) * 0.25))
            scale(0.9);
    }

    50% {
        opacity: 0.85;

        transform:
            translate(
                calc(var(--movimiento-x) * -0.15),
                calc(var(--movimiento-y) * 0.5)
            )
            rotate(calc(var(--rotacion) * 0.5))
            scale(0.95);
    }

    70% {
        opacity: 0.55;

        transform:
            translate(
                calc(var(--movimiento-x) * 0.45),
                calc(var(--movimiento-y) * 0.75)
            )
            rotate(calc(var(--rotacion) * 0.75))
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            translate(
                var(--movimiento-x),
                var(--movimiento-y)
            )
            rotate(var(--rotacion))
            scale(1.05);
    }

}


    </style>
</head>

    <!-- JAVASCRIPT -->

<script>

        // =========================================
        // VARIABLES GLOBALES
        // =========================================

        var audio = document.getElementById("musicaFondo");
        var btn = document.getElementById("btnAudio");
        var lottieMusic = document.getElementById("lottieMusic");
        var contenedorSobre = document.getElementById("contenedor-sobre");

        audio.volume = 0.2;

        window.onload = function() {
            document.body.style.opacity = '1';
        };

        // =========================================
        // CUENTA REGRESIVA
        // =========================================

        const fechaDestino = new Date("Nov 28, 2026 12:00:00").getTime();
        const x = setInterval(function() {
            const ahora = new Date().getTime();
            const distancia = fechaDestino - ahora;

            document.getElementById("dias").innerHTML = Math.floor(distancia / (1000 * 60 * 60 * 24));
            document.getElementById("horas").innerHTML = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("minutos").innerHTML = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("segundos").innerHTML = Math.floor((distancia % (1000 * 60)) / 1000);
        }, 1000);

        // =========================================
        // APERTURA DEL SOBRE
        // =========================================

        contenedorSobre.onclick = function() {
            if (contenedorSobre.classList.contains('abierto') || contenedorSobre.classList.contains('oculto')) {
                return;
            }

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }

            audio.play();

            const indicadorAbrir = document.getElementById('indicadorAbrir');
            const dedicatoriaSobre = document.getElementById('dedicatoriaSobre');

            indicadorAbrir.style.opacity = '0';
            indicadorAbrir.style.display = 'none';
            dedicatoriaSobre.style.opacity = '0';
            dedicatoriaSobre.style.display = 'none';

            contenedorSobre.classList.add('abierto');

            setTimeout(() => {
                contenedorSobre.classList.add('desvanecer-base');
            }, 2000);

            setTimeout(() => {
                contenedorSobre.classList.add('oculto');
                contenedorSobre.style.display = 'none';
            }, 6000);

            setTimeout(() => {
                contenedorSobre.style.pointerEvents = 'none';
            }, 2000);
        };

        // =========================================
        // BOTÓN AUDIO
        // =========================================

        btn.onclick = function() {
            if (audio.paused) {
                audio.play();
                lottieMusic.play();
                btn.style.opacity = '0.6';
            } else {
                audio.pause();
                lottieMusic.pause();
                btn.style.opacity = '0.3';
            }
        };

        // =========================================
        // SWIPER
        // =========================================

        var swiper = new Swiper(".mySwiper", {
            effect: "coverflow",
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: "auto",
            loop: true,
            autoplay: {
                delay: 3000,
                disableOnInteraction: false,
                pauseOnMouseEnter: false,
            },
            speed: 1500,
            coverflowEffect: {
                rotate: 0,
                stretch: 0,
                depth: 200,
                modifier: 1,
                slideShadows: true
            }
        });


        // =========================================
        // FUNCIÓN PARA CONTROLAR VIDEOS
        // =========================================

        function playCarouselVideo(slide) {
            let img = slide.querySelector('.slide-img');
            let video = slide.querySelector('.slide-video');
            let indicator = slide.querySelector('.video-indicator');

            if (video.style.display === 'block') {
                if (video.paused) {
                    // ▶️ REPRODUCIR
                    video.play();
                    swiper.autoplay.stop();
                    slide.classList.add('reproduciendo');
                    indicator.style.opacity = '0'; // ← OCULTAR INDICADOR
                } else {
                    // ⏸️ PAUSAR
                    video.pause();
                    swiper.autoplay.start();
                    video.style.display = 'none';
                    img.style.display = 'block';
                    slide.classList.remove('reproduciendo');
                    indicator.style.opacity = '0.8'; // ← MOSTRAR INDICADOR
                }
            } else {
                // 🆕 PRIMERA VEZ
                audio.pause();
                
                // Restaurar todos los slides
                document.querySelectorAll('.slide-video').forEach(v => {
                    v.style.display = 'none';
                    v.pause();
                });
                document.querySelectorAll('.slide-img').forEach(i => {
                    i.style.display = 'block';
                });
                document.querySelectorAll('.swiper-slide').forEach(s => {
                    s.classList.remove('reproduciendo');
                });
                document.querySelectorAll('.video-indicator').forEach(i => {
                    i.style.opacity = '0.8'; // ← MOSTRAR INDICADOR EN TODOS
                });

                // Mostrar y reproducir el video seleccionado
                img.style.display = 'none';
                video.style.display = 'block';
                video.play();
                slide.classList.add('reproduciendo');
                indicator.style.opacity = '0'; // ← OCULTAR INDICADOR
                swiper.autoplay.stop();
            }
        }

        // =========================================
        // MOSTRAR FIRMA
        // =========================================

        window.addEventListener('load', function() {
            setTimeout(function() {
                var firma = document.getElementById('firma-gio');
                if (firma) {
                    firma.style.opacity = '0.6';
                }
            }, 30000);
        });

        // =========================================
        // LEER NOMBRE DEL INVITADO
        // =========================================

        window.addEventListener('DOMContentLoaded', (event) => {
            const urlParams = new URLSearchParams(window.location.search);
            const nombreParam = urlParams.get('to');
            const contenedorNombre = document.getElementById('nombre-invitado');

            if (nombreParam) {
                contenedorNombre.innerText = decodeURIComponent(nombreParam.replace(/\_/g, ' '));
            }
        });

        // =========================================
        // OCULTAR FLECHA DE SCROLL
        // =========================================

        setTimeout(() => {
            const indicador = document.getElementById("indicadorScroll");
            if (indicador) {
                indicador.style.opacity = '0';
                setTimeout(() => {
                    indicador.style.display = 'none';
                }, 1000);
            }
        }, 32000);

        // =========================================
        // EFECTO DE PÉTALOS
        // =========================================

        function lanzarPetalos(x, y) {
            const cantidadPetalos = 9;

            for (let i = 0; i < cantidadPetalos; i++) {
                const petalo = document.createElement('img');
                petalo.src = 'petalo.png';
                petalo.className = 'petalo-animado';

                petalo.style.left = x + 'px';
                petalo.style.top = y + 'px';

                const tamano = Math.random() * 10 + 20;
                petalo.style.width = tamano + 'px';

                const movimientoX = (Math.random() - 0.5) * 320;
                const movimientoY = Math.random() * 280 + 220;
                const rotacion = Math.random() * 900 - 450;

                petalo.style.setProperty('--movimiento-x', movimientoX + 'px');
                petalo.style.setProperty('--movimiento-y', movimientoY + 'px');
                petalo.style.setProperty('--rotacion', rotacion + 'deg');

                document.body.appendChild(petalo);

                setTimeout(function() {
                    petalo.remove();
                }, 5000);
            }
        }

        document.addEventListener('click', function(event) {
            if (!contenedorSobre.classList.contains('oculto') && contenedorSobre.style.pointerEvents !== 'none') {
                return;
            }
            lanzarPetalos(event.clientX, event.clientY);
        });

        let ultimoPetaloX = 0;
        let ultimoPetaloY = 0;
        let moviendo = false;

        document.addEventListener('touchstart', function(event) {
            if (!contenedorSobre.classList.contains('oculto') && contenedorSobre.style.pointerEvents !== 'none') {
                return;
            }
            const toque = event.touches[0];
            ultimoPetaloX = toque.clientX;
            ultimoPetaloY = toque.clientY;
            moviendo = true;
        });

        document.addEventListener('touchmove', function(event) {
            if (!moviendo) return;
            if (!contenedorSobre.classList.contains('oculto') && contenedorSobre.style.pointerEvents !== 'none') {
                return;
            }
            const toque = event.touches[0];
            const distanciaX = Math.abs(toque.clientX - ultimoPetaloX);
            const distanciaY = Math.abs(toque.clientY - ultimoPetaloY);

            if (distanciaX > 45 || distanciaY > 45) {
                lanzarPetalos(toque.clientX, toque.clientY);
                ultimoPetaloX = toque.clientX;
                ultimoPetaloY = toque.clientY;
            }
        });

        document.addEventListener('touchend', function() {
            moviendo = false;
        });

        // =========================================
        // CARRUSEL DE FOTOS
        // =========================================

        (function() {
            const fotos = document.querySelectorAll('.slide-foto');
            let index = 0;
            const totalFotos = fotos.length;
            const tiempoVisible = 4000;
            const tiempoTransicion = 1000;

            function mostrarFoto(n) {
                fotos.forEach((f, i) => {
                    f.style.opacity = (i === n) ? '1' : '0';
                    f.style.transform = (i === n) ? 'scale(1)' : 'scale(1.02)';
                });
            }

            function siguienteFoto() {
                index = (index + 1) % totalFotos;
                mostrarFoto(index);
            }

            mostrarFoto(0);
            setInterval(siguienteFoto, tiempoVisible + tiempoTransicion);
        })();

    </script>
